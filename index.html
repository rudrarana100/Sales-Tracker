    <!-- Structured Data: FAQ (AEO — Answer Engine Optimization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is SalesTracker CRM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SalesTracker is an outbound sales CRM for Indian teams that helps manage leads, track cold calls, schedule follow-ups, book Google Meets, and manage a visual sales pipeline from one workspace."
          }
        },
        {
          "@type": "Question",
          "name": "How does SalesTracker help with cold calling?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SalesTracker provides a sequential cold calling workflow that walks agents one lead at a time, records call outcomes (no answer, callback, gatekeeper, interested, not interested), and automatically schedules follow-ups based on the outcome."
          }
        },
        {
          "@type": "Question",
          "name": "Can I book Google Meet calls inside SalesTracker?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. SalesTracker creates Google Meet links directly from the call session or lead page, updates the lead status to Meeting Booked, and sends a confirmation with the meeting link over WhatsApp."
          }
        },
        {
          "@type": "Question",
          "name": "Does SalesTracker work for sales teams in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. SalesTracker is built for Indian outbound sales teams, supports Indian phone numbers and WhatsApp sharing, and is used by teams in Delhi NCR, Mumbai, Bengaluru, Hyderabad, Chennai, Pune, and Kolkata."
          }
        },
        {
          "@type": "Question",
          "name": "What features does the SalesTracker sales pipeline include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The SalesTracker pipeline offers drag-and-drop deal management across stages — Contacted, Warm, Meeting Booked, Proposal Sent, Won, and Lost — with per-lead contact, follow-up, and quick-action tools on every card."
          }
        }
      ]
    }
    </script>
